name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'crm-dashboard/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://gohhqrbcaqvpkcltazzk.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvaGhxcmJjYXF2cGtjbHRhenprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTU3MzgsImV4cCI6MjA5MTU5MTczOH0.jWIoLpWE2U_YjRbv3cU_MTZHqP9LTVizId2_yJSS7-U
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crm-dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://riccardobozzato94.github.io/sito-sergio/admin
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4