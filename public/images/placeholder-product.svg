<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Warm espresso background -->
  <rect width="400" height="400" fill="#2c241e"/>

  <!-- Subtle radial glow -->
  <ellipse cx="200" cy="180" rx="140" ry="130" fill="rgba(212,165,116,0.08)"/>

  <!-- Bread / pastry icon -->
  <g transform="translate(200,175)" stroke="#d4a574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bread loaf -->
    <path d="M-60,20 C-60,-30 -20,-50 0,-55 C20,-50 60,-30 60,20Z" fill="rgba(212,165,116,0.12)"/>
    <!-- Score marks on bread -->
    <line x1="-25" y1="-5" x2="-15" y2="-20"/>
    <line x1="-5" y1="-5" x2="5" y2="-20"/>
    <line x1="15" y1="-5" x2="25" y2="-20"/>
    <!-- Steam -->
    <path d="M-15,-60 C-20,-75 -10,-85 -15,-100" stroke="rgba(212,165,116,0.3)" stroke-width="1.5"/>
    <path d="M10,-58 C5,-72 15,-82 10,-95" stroke="rgba(212,165,116,0.25)" stroke-width="1.5"/>
    <path d="M-40,-45 C-45,-55 -38,-62 -42,-72" stroke="rgba(212,165,116,0.2)" stroke-width="1"/>
    <!-- Small flour dots -->
    <circle cx="-30" cy="15" r="1.5" fill="rgba(255,255,255,0.12)"/>
    <circle cx="25" cy="10" r="1" fill="rgba(255,255,255,0.1)"/>
    <circle cx="-10" cy="18" r="1.2" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Text -->
  <text x="200" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="rgba(212,165,116,0.5)" letter-spacing="0.15em">PRODOTTO ARTIGIANALE</text>
  <text x="200" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.2)" letter-spacing="0.1em">PANIFICIO DA SERGIO</text>

  <!-- Corner flourishes -->
  <path d="M30,30 L45,30 L45,45" stroke="rgba(212,165,116,0.15)" stroke-width="1" fill="none"/>
  <path d="M370,30 L355,30 L355,45" stroke="rgba(212,165,116,0.15)" stroke-width="1" fill="none"/>
  <path d="M30,370 L45,370 L45,355" stroke="rgba(212,165,116,0.15)" stroke-width="1" fill="none"/>
  <path d="M370,370 L355,370 L355,355" stroke="rgba(212,165,116,0.15)" stroke-width="1" fill="none"/>
</svg>
